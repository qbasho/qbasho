<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Qbasho | Contact</title>
        <link rel="shortcut icon" href="./assets/icon2.svg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="./assets/style.css" rel="stylesheet">
    </head>
    <body>
        <header class="header">
            <div class="brand-group">
                <a href="./index.html"><img src="./assets/icon2.svg" class="logo"></a>
                <a class="brand-name" style="font-weight: bold;">Qbasho</a>
            </div>
            <nav class="nav-links">
                <a class="navbar margin" href="./index.html">Home</a>
                <a class="margin active" href="./contact.html">Contact</a>
            </nav>
        </header>
        <div id="page-container">
            <div id="content-wrap">
                <div class="background-mail">
                    <h1 class="title">Contact</h1>
                    <p class="title">For any business inquiries, the easiest way to contact me is via email, which I check daily.</p>
                    <p>Simply click the button below to send me a message.</p>
                    <div class="mail" id="mail">Send e-mail</div>
                </div>
            </div>
        </div>
        <div id="footer-placeholder"></div>
                <script>
                    function initMailButton() {
                        const sendMailBtn = document.getElementById('mail');
                            if (sendMailBtn) {
                                sendMailBtn.addEventListener('click', () => {
                                    const targetAddress = 'jakub@szostko.com';
                                    const subjectLine = "Question from Website";
                                    const bodyText = "Hello Jakub,\n\nI am reaching out regarding...";
                                    
                                    const mailtoUri = `mailto:${targetAddress}?subject=${encodeURIComponent(subjectLine)}&body=${encodeURIComponent(bodyText)}`;
                                    window.location.href = mailtoUri;
                                });
                            }
                    }
                    fetch('footer.html')
                        .then(response => response.text())
                        .then(data => {
                            document.getElementById('footer-placeholder').innerHTML = data;
                            initMailButton(); 
                        })
                        .catch(error => console.error('Wystąpił błąd:', error));
                </script>
    </body>
</html>
